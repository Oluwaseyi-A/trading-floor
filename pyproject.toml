[project]
name = "trading-floor"
version = "0.1.0"
description = "Hosted multi-agent trading floor demo (OpenAI Agents SDK + MCP, Gradio UI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.22.0",
    "openai>=1.68.2",
    "openai-agents>=0.0.15",
    "mcp[cli]>=1.5.0",
    "mcp-server-fetch>=2025.1.17",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.0.0",
    "plotly>=6.0.1",
    "requests>=2.32.3",
    "polygon-api-client>=1.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

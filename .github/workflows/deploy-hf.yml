name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub>=0.24"

      - name: Mirror repo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: Olu-Victor/trading-floor
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::HF_TOKEN secret is not configured on this repo."
            exit 1
          fi
          python - <<PY
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=".",
              commit_message=f"Mirror from GitHub @ {os.environ['GIT_SHA'][:8]}",
              ignore_patterns=[
                  ".git/**",
                  ".github/**",
                  ".venv/**",
                  "__pycache__/**",
                  "**/__pycache__/**",
                  "*.db",
                  "*.db-journal",
                  "memory/**",
                  ".env",
                  ".env.*",
              ],
          )
          print("HF deploy ok")
          PY
